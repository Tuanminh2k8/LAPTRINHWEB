<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
            <linearGradient id="grad-coca" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a55eee;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#652c90;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="500" height="500" rx="30" fill="url(#grad-coca)"/>
        <!-- Straw -->
        <rect x="280" y="50" width="12" height="150" rx="6" fill="#ff4757" transform="rotate(25 280 50)"/>
        <!-- Cup Lid -->
        <ellipse cx="250" cy="150" rx="80" ry="15" fill="#ced6e0"/>
        <!-- Cup Body -->
        <path d="M 175,150 L 325,150 L 295,330 L 205,330 Z" fill="#ff4757"/>
        <!-- White wave on cup -->
        <path d="M 180,240 Q 250,280 320,240 L 317,260 Q 250,300 183,260 Z" fill="#ffffff"/>
        <!-- Text on cup -->
        <text x="250" y="230" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="22" fill="#ffffff">COLA</text>
        <text x="50%" y="420" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">COLD COCA COLA</text>
    </svg>