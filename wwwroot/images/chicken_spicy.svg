<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
            <linearGradient id="grad-chicken" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ff6b81;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="500" height="500" rx="30" fill="url(#grad-chicken)"/>
        <!-- Drumstick Bone -->
        <rect x="290" y="270" width="80" height="30" rx="15" fill="#f1f2f6" transform="rotate(30 290 270)"/>
        <circle cx="370" cy="300" r="20" fill="#f1f2f6"/>
        <circle cx="355" cy="325" r="20" fill="#f1f2f6"/>
        <!-- Chicken Meat -->
        <path d="M 120,240 C 90,160 240,120 300,200 C 340,250 300,310 220,300 C 170,295 140,280 120,240 Z" fill="#eccc68" stroke="#ffa502" stroke-width="4"/>
        <!-- Crispy Textures -->
        <path d="M 150,180 Q 160,170 170,185" stroke="#ff7f50" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 200,220 Q 215,210 220,230" stroke="#ff7f50" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 230,160 Q 240,150 250,165" stroke="#ff7f50" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 160,240 Q 170,230 185,245" stroke="#ff7f50" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 260,220 Q 275,210 280,230" stroke="#ff7f50" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Fire/Spicy Indicator -->
        <path d="M 200,120 Q 210,90 200,70 Q 225,95 210,120 Z" fill="#ff4757"/>
        <path d="M 220,110 Q 230,85 220,70 Q 240,90 230,110 Z" fill="#ffa502"/>
        <text x="50%" y="420" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">SPICY FRIED CHICKEN</text>
    </svg>