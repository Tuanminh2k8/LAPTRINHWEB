<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
            <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ee5253;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="500" height="500" rx="30" fill="url(#grad-bg)"/>
        <!-- Top Bun -->
        <path d="M 120,220 C 120,130 380,130 380,220 Z" fill="#eccc68"/>
        <!-- Sesame Seeds -->
        <ellipse cx="200" cy="160" rx="4" ry="8" fill="#ffffff" transform="rotate(30 200 160)"/>
        <ellipse cx="250" cy="150" rx="4" ry="8" fill="#ffffff" transform="rotate(-10 250 150)"/>
        <ellipse cx="300" cy="170" rx="4" ry="8" fill="#ffffff" transform="rotate(20 300 170)"/>
        <ellipse cx="160" cy="190" rx="4" ry="8" fill="#ffffff" transform="rotate(-40 160 190)"/>
        <ellipse cx="340" cy="190" rx="4" ry="8" fill="#ffffff" transform="rotate(40 340 190)"/>
        <!-- Lettuce -->
        <path d="M 100,220 Q 130,240 160,220 Q 190,240 220,220 Q 250,240 280,220 Q 310,240 340,220 Q 370,240 400,220 L 400,230 Q 370,250 340,230 Q 310,250 280,230 Q 250,250 220,230 Q 190,250 160,230 Q 130,250 100,230 Z" fill="#2ed573"/>
        <!-- Cheese -->
        <polygon points="110,235 390,235 370,265 310,250 250,275 190,250 130,265" fill="#ffa502"/>
        <!-- Beef Patty -->
        <rect x="110" y="260" width="280" height="30" rx="15" fill="#747d8c"/>
        <!-- Bottom Bun -->
        <path d="M 120,290 L 380,290 C 380,330 120,330 120,290 Z" fill="#ffa502" opacity="0.8"/>
        <!-- Text -->
        <text x="50%" y="420" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">CHEESE BURGER</text>
    </svg>