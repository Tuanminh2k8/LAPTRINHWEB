<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
            <linearGradient id="grad-pizza" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#48dbfb;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#2e86de;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="500" height="500" rx="30" fill="url(#grad-pizza)"/>
        <!-- Pizza Crust -->
        <circle cx="250" cy="230" r="140" fill="#d1ccc0" stroke="#c8d6e5" stroke-width="8"/>
        <!-- Cheese -->
        <circle cx="250" cy="230" r="125" fill="#feca57"/>
        <!-- Seafood Toppings (Shrimps & Squids) -->
        <!-- Shrimp 1 -->
        <path d="M 200,180 Q 180,160 200,140 Q 210,150 205,165" fill="#ff6b6b" stroke="#ee5253" stroke-width="3"/>
        <!-- Shrimp 2 -->
        <path d="M 300,260 Q 320,240 300,220 Q 290,230 295,245" fill="#ff6b6b" stroke="#ee5253" stroke-width="3"/>
        <!-- Squid Rings -->
        <circle cx="230" cy="270" r="15" fill="none" stroke="#ffffff" stroke-width="6"/>
        <circle cx="280" cy="170" r="12" fill="none" stroke="#ffffff" stroke-width="5"/>
        <!-- Bell Peppers -->
        <rect x="160" y="220" width="8" height="25" rx="3" fill="#1dd1a1" transform="rotate(30 160 220)"/>
        <rect x="310" y="190" width="8" height="25" rx="3" fill="#1dd1a1" transform="rotate(-45 310 190)"/>
        <rect x="250" y="280" width="8" height="25" rx="3" fill="#ff9f43" transform="rotate(15 250 280)"/>
        <text x="50%" y="420" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">SEAFOOD PIZZA</text>
    </svg>