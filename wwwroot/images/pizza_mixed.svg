<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
            <linearGradient id="grad-pizza2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#10ac84;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="500" height="500" rx="30" fill="url(#grad-pizza2)"/>
        <!-- Crust -->
        <circle cx="250" cy="230" r="140" fill="#eccc68" stroke="#ffa502" stroke-width="8"/>
        <!-- Cheese -->
        <circle cx="250" cy="230" r="125" fill="#ffa502"/>
        <!-- Pepperoni -->
        <circle cx="210" cy="180" r="18" fill="#ff4757"/>
        <circle cx="290" cy="200" r="18" fill="#ff4757"/>
        <circle cx="220" cy="280" r="18" fill="#ff4757"/>
        <circle cx="290" cy="270" r="18" fill="#ff4757"/>
        <!-- Mushrooms -->
        <path d="M 160,180 C 160,160 190,160 190,180 Z" fill="#f1f2f6"/>
        <rect x="171" y="180" width="8" height="12" fill="#f1f2f6"/>
        <!-- Olive Slices -->
        <circle cx="250" cy="140" r="8" fill="none" stroke="#2f3542" stroke-width="4"/>
        <circle cx="170" cy="240" r="8" fill="none" stroke="#2f3542" stroke-width="4"/>
        <circle cx="330" cy="240" r="8" fill="none" stroke="#2f3542" stroke-width="4"/>
        <text x="50%" y="420" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#ffffff">DELUXE PIZZA</text>
    </svg>